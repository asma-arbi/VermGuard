<div class="audit-container">
  <div class="audit-header">
    <h2><i class="fas fa-shield-alt"></i> Security Audit Log</h2>
    <p>Track all administrative actions across the platform.</p>
  </div>

  <div class="audit-content">
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner"></div>
      <p>Loading audit trail...</p>
    </div>

    <div *ngIf="errorMessage" class="error-state">
      <p>{{ errorMessage }}</p>
    </div>

    <table class="vermeg-table" *ngIf="!isLoading && !errorMessage">
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Action Type</th>
          <th>Performed By</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let log of logs">
          <td class="date-cell">{{ log.timestamp | date:'medium' }}</td>
          <td>
            <span class="badge" [ngClass]="{
              'badge-create': log.action.includes('CREATE'),
              'badge-update': log.action.includes('UPDATE') || log.action.includes('EXPORT'),
              'badge-delete': log.action.includes('DELETE')
            }">
              {{ log.action }}
            </span>
          </td>
          <td class="user-cell">{{ log.performedBy }}</td>
          <td class="details-cell">{{ log.details }}</td>
        </tr>
        <tr *ngIf="logs.length === 0">
          <td colspan="4" class="empty-state">No audit logs found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
